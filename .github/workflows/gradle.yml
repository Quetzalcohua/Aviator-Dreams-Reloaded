name: Aviator Dreams 26.1.2 Fabric

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          java-package: jdk
          cache: gradle
          overwrite-settings: false
      - name: Build Fabric only
        run: |
          chmod +x ./gradlew
          ./gradlew clean :fabric:build --no-daemon
      - name: Verify distributable metadata and resources
        shell: pwsh
        run: ./scripts/verify-jar.ps1
      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aviator-dreams-reloaded-26.1.2-fabric
          path: 'fabric/build/libs/*.jar'
          if-no-files-found: error
