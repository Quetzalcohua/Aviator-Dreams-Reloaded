plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}
base { archivesName = "$rootProject.archives_name-fabric" }
repositories {
    maven { url = 'https://maven.conczin.net/Artifacts' }
}
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
dependencies {
    minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version+$rootProject.minecraft_version"
    // Aircraft publishes its optional development viewers as runtime dependencies.
    // Neither viewer is required by this addon or by Aircraft at runtime.
    implementation("net.conczin:immersive_aircraft:$rootProject.immersive_aircraft_version+$rootProject.minecraft_version+fabric") {
        exclude group: "mezz.jei"
        exclude group: "me.shedaniel", module: "RoughlyEnoughItems-fabric"
    }
}
jar {
    from(rootProject.file('LICENSE'))
}
processResources {
    def props = [
            "id"                         : project.id,
            "name"                       : project.displayname,
            "description"                : project.description,
            "author"                     : project.author,
            "license"                    : project.license,
            "websiteUrl"                 : project.website,
            "sourcesUrl"                 : project.sources,
            "issueTrackerUrl"            : project.issues,
            "forgeUpdateUrl"             : project.updater,
            "version"                    : project.version,
            "fabricLoaderDependency"     : project.fabric_loader_dependency,
            "minecraftDependency"        : project.fabric_minecraft_dependency,
            "immersiveAircraftDependency": project.fabric_immersive_aircraft_dependency,
            "fabricAPIDependency"        : project.fabric_api_dependency
    ]

    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}
